name: Test integration

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test on Home Assistant
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Home Assistant test harness
        run: |
          python -m pip install pytest-homeassistant-custom-component
          # Assist pipeline, TTS and ffmpeg components need these at import time.
          python -m pip install ha-ffmpeg hassil home-assistant-intents mutagen pymicro-vad pyspeex-noise

      - name: Run tests
        run: python -m pytest -q

      - name: Validate JSON files
        run: |
          python - <<'PY'
          import json, pathlib
          for p in pathlib.Path(".").rglob("*.json"):
              json.load(open(p, encoding="utf-8"))
          PY
